<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização</title>
</head>
<body>
        <div class="logo-login">
                <img src="../assets/images/logo-tech-match-2.png" alt="logo icon">
                <img src="../assets/images/logo-tech-match-3.png" alt="logo texto">
            </div>

        <section class="menu-personalizacao">
            <img src="../assets/icons/coracao-preenchido.svg" class="coracao-preenchido" alt="Coração Preenchido">
            <img src="../assets/icons/coracao-vazado.svg" class="coracao-vazado" alt="Coração Vazio">
            <h3 class="titulo-inicial">Perfil acadêmico e profissional</h3>

            <main class="perfil">

                <section class="personalizacao-parte-um">
                <h1 class="criar-conta">Perfil Acadêmico e Profissional</h1>

                <label class="instituicao">Instituição</label>
                    <select class="instituicao" id="instituicao">
                        <option value "" disable selected>Selecione uma das instituições abaixo</option>
                        <option value "Ferraz de Vasconcelos">Ferraz de Vasconcelos</option>
                    </select>
                
                    <label class="curso">Curso Atual</label>
                    <select class="curso" id="curso">
                        <option value "" disable selected>Selecione um dos cursos abaixo</option>
                        <option value "ADS">Analise e Desenvolvimento de Sistemas</option>
                    </select>

                    <div class="botoes-semestre">
                        <h3 class="semestre">Semestre</h3>
                        <button type="button" class="botao-semestre">1º</button>
                        <button type="button" class="botao-semestre">2º</button>
                        <button type="button" class="botao-semestre">3º</button>
                        <button type="button" class="botao-semestre">4º</button>
                        <button type="button" class="botao-semestre">5º</button>
                        <button type="button" class="botao-semestre">6º</button>
                    </div>

                    <div class="selecao-habilidades">
                        <h3>Habilidades</h3>
                             <div class="tags-habilidades" id="tags-habilidades">
                                    <input type="text" id="tags-habilidades" placeholder="Ex.: Python" />
                    </div>
                    
                    <button type="button" class="botao-continuar">Continuar</button>
                </section>

                <section class="personalizacao-parte-dois">
                    <h3 class="criar-conta">Perfil Acadêmico e Profissional</h1>

                    <h1 class="anexos">Anexos</h1>
                    <div class="anexar-arquivos">
                            <label for="anexar-arquivos" class="area-upload">
                                <p>
                                     Arraste seus arquivos aqui
                                </p>
                                <input type="file" id="campo-anexo" multiple hidden />
                            </label>

  
                            <ul id="lista-ficheiros" class="lista-ficheiros"></ul>

                            <button type="button" class="finalizar-cadastro">Finalizar Cadastro</button>
                    </div>
                </section>
                </section>
</body>
</html>
