<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
     <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <main class="acesso">

    <h1 class="criar-conta">Crie sua conta</h1>

    <form action="#" method="post">

        <div class="campo">
            <label for="nome-completo">Nome Completo</label>
            <input type="text" id="nome-completo" name="nome-completo" placeholder="Ex. José da Silva Santos">
         </div>

        <div class="campo">
            <label for="email-institucional">Email Institucional</label>
            <input type="email" id="email-institucional" name="email-institucional" placeholder="Ex. jose.santos@aluno.cps.sp.gov.br">
        </div>

        <div class="campo">
            <label for="digite-sua-senha">Digite sua senha</label>
            <input type="password" id="digite-sua-senha" name="digite-sua-senha">
            <button type="button" id="olho-magico" class="olho-magico">
                <img class="imagem-olho-magico" src="../assets/icons/olho-magico.svg">
            </button>
        </div>

        <div class="requisitos-senha">
            <h5>Sua senha deve ter:</h5>

            <ul>
                <li>No mínimo 8 caracteres</li>
                <li>Pelo menos um caractere especial</li>
                <li>Pelo menos um número</li>
            </ul>
        </div>

        <div class="termos">
            <input type="checkbox" id="check-termos" name="check-termos" required>

            <label for="check-termos">
                Li e aceito os
                <a href="#" id="abrir-modal">termos de uso</a>.
            </label>
        </div>
        
        <button type="submit" class="botao-entrar-cadastrar"> 
            <a href="../HTML/personalização.html" class="personalizacao">Cadastrar</a>
        </button>
        

    </form>

</main>
 
</body>
</html>
